<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВСЕКУПОНЫ — QR-билеты</title>
<!-- ==========================================================================
     QR-билеты — продолжение QR-купона из презентации (deck-v4.html, .qrc):
     тот же язык «купон с линией отрыва и вырезами», но вертикальный —
     под пост, сторис, наклейку на кассу, стойку у входа.

     Четыре варианта по референсам заказчика (билет dribbble с волнистым
     краем, визитка с аватаром):
       A. Билет — волнистый верх и низ, красный QR с логотипом, корешок с сайтом.
       B. Визитка — логотип в круге сверху, название, пунктир с вырезами, QR.
       D. Красный билет — инверсия A: белый QR на красном.
       E. «Просканируй меня» — по референсу с −50%, но вертикально: точечный
          QR в пунктирной рамке занимает большую часть, ниже линия отрыва и
          красная плашка с надписью. Купон белый.
       F. То же на красном купоне: плашка белая с красной надписью, QR —
          тёмный на белой подложке (белый на красном камеры не читают).
       G. Горизонтальный, как исходный референс: QR слева, справа плашка
          с надписью снизу вверх; линия отрыва вертикальная.
       H. Плашка сверху, QR снизу; края волнистые, как у билета A.
       I. Тёмный купон: QR на белой подложке, красная плашка.
       J. Плашка с гладким скруглением и сайтом под надписью — для
          сравнения со ступенчатыми углами E/F.

     QR — build-qr.py (уровень H, окно под логотип в центре) → qr/*.svg.
     Контуры билетов — векторные, считает скрипт внизу: в Figma переносятся
     одним path, вырезы — настоящие, а не круги поверх.

     PNG — render-qr.py → out/qr/qr-a.png … qr-f.png (без C) (1080×1350).
     ========================================================================== -->
<link rel="stylesheet" href="fonts/onest.css">
<style>
:root{
  --brand:#DD443C;
  --brand-50:#FEF3F2;
  --ink:#1B1B1B;
  --ink-2:#565656;
  --ink-3:#8A8A8A;
  --line-strong:#D3D3D3;
  --surface:#F6F6F6;
  --surface-2:#ECECEC;
  --font:"Onest", ui-sans-serif, system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E4E4E4;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.sheet{display:flex;flex-wrap:wrap;justify-content:center;gap:48px;padding:48px 16px 96px}
/* Плитка — пост 1080×1350, на экране уменьшена */
.tile{position:relative;flex:none;width:1080px;height:1350px;display:grid;place-items:center;overflow:hidden;zoom:.42}
.tile--red{background:var(--brand)}
.tile--grey{background:var(--surface-2)}
.tile--light{background:var(--surface)}
.bare .sheet{padding:0;gap:0}
.bare .tile{zoom:1}

/* Билет: контур — svg.qt__bg под содержимым, тень — фильтром на svg */
.qt{position:relative;display:flex;flex-direction:column;align-items:center;isolation:isolate}
.qt__bg{position:absolute;inset:0;z-index:-1;overflow:visible}
.qt__bg path{fill:#fff}
.qt--shadow .qt__bg{filter:drop-shadow(0 40px 50px rgba(60,15,10,.28))}
.qt--soft .qt__bg{filter:drop-shadow(0 30px 60px rgba(0,0,0,.12))}
.qt__dash{position:absolute;left:0;right:0;height:0;pointer-events:none}

/* QR и логотип в окне по центру кода */
.qr{position:relative;display:block}
.qr > img{display:block;width:100%;height:100%}
.qr__logo{position:absolute;left:50%;top:50%;width:21%;height:21%;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;background:var(--brand)}
.qr__logo img{position:absolute;left:13%;top:13%;width:74%;height:74%;object-fit:contain}
.qr__logo--white{background:#fff}

/* ---------- A. Билет ---------- */
.qa{width:640px;padding:96px 0 0}
.qa .qr{width:440px;height:440px}
.qa__stub{height:250px;margin-top:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.qa__k{font-size:28px;font-weight:500;color:var(--ink-2)}
.qa__site{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--brand)}

/* ---------- B. Визитка ---------- */
.qb{width:620px;padding:120px 0 72px}
.qb__ava{position:absolute;left:50%;top:-90px;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:var(--brand);
  display:grid;place-items:center;box-shadow:0 0 0 10px #fff}
.qb__ava img{display:block;width:auto;height:130px}
.qb__name{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.qb__sub{margin-top:12px;font-size:26px;font-weight:500;color:var(--ink-3)}
.qb__gap{height:150px}
.qb .qr{width:400px;height:400px}
.qb__site{margin-top:40px;font-size:30px;font-weight:700;color:var(--ink-2)}
.qb__site b{color:var(--brand);font-weight:800}


/* ---------- D. Красный билет ---------- */
.qd .qt__bg path{fill:var(--brand)}
.qd{color:#fff}
.qd .qa__k{color:rgba(255,255,255,.78)}
.qd .qa__site{color:#fff}

/* ---------- E/F. «Просканируй меня» ---------- */
.qe{width:660px;padding:56px 56px 0}
.qe__frame{width:548px;height:548px;padding:40px;border:7px dashed #D3D3D3;border-radius:40px}
.qe .qr{width:100%;height:100%}
.qe__gap{height:76px}
.qe__plq{width:548px;margin-bottom:56px;height:150px;display:grid;place-items:center;white-space:nowrap;background:var(--brand);color:#fff;
  font-size:38px;font-weight:800;letter-spacing:.01em;line-height:1;text-align:center;text-transform:uppercase;
  /* ступенчатые «пиксельные» углы, как у плашки −50% в референсе */
  clip-path:polygon(0 24px,8px 24px,8px 16px,16px 16px,16px 8px,24px 8px,24px 0,calc(100% - 24px) 0,calc(100% - 24px) 8px,calc(100% - 16px) 8px,calc(100% - 16px) 16px,calc(100% - 8px) 16px,calc(100% - 8px) 24px,100% 24px,
    100% calc(100% - 24px),calc(100% - 8px) calc(100% - 24px),calc(100% - 8px) calc(100% - 16px),calc(100% - 16px) calc(100% - 16px),calc(100% - 16px) calc(100% - 8px),calc(100% - 24px) calc(100% - 8px),calc(100% - 24px) 100%,
    24px 100%,24px calc(100% - 8px),16px calc(100% - 8px),16px calc(100% - 16px),8px calc(100% - 16px),8px calc(100% - 24px),0 calc(100% - 24px))}
.qf .qt__bg path:first-child{fill:var(--brand)}
/* Белый QR на красном многие камеры не читают (инверсный код) — поэтому
   код тёмный на белой подложке, а пунктир рамки — вокруг неё. */
.qf .qe__frame{border:0;background:#fff;outline:6px dashed rgba(255,255,255,.55);outline-offset:14px;width:520px;height:520px;padding:48px;margin:14px 0}
.qf .qe__plq{background:#fff;color:var(--brand)}

/* ---------- G. Горизонтальный ---------- */
.qg{flex-direction:row;align-items:center;width:auto;padding:48px}
.qg .qe__frame{width:560px;height:560px}
.qg .qe__gap{width:76px;height:auto;align-self:stretch}
.qg .qe__plq{width:180px;height:560px;margin:0}
.qg .qe__plq{position:relative}
.qg .qe__plq span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font-size:40px}

/* ---------- H. Плашка сверху, волнистые края ---------- */
.qh{padding:72px 56px 72px}
.qh .qe__plq{margin:0}

/* ---------- I. Тёмный купон ---------- */
.qi .qt__bg path:first-child{fill:var(--ink)}
.qi .qe__frame{border:0;background:#fff;outline:6px dashed rgba(255,255,255,.35);outline-offset:14px;width:520px;height:520px;padding:48px;margin:14px 0}

/* ---------- J. Гладкая плашка с сайтом ---------- */
.qe__plq--round{clip-path:none;border-radius:28px;height:200px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.qe__plq--round small{font-size:32px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.85}
</style>
</head>
<body>
<script>if (/[?&]bare=1/.test(location.search)) document.documentElement.classList.add("bare");</script>
<main class="sheet">

  <!-- A. Билет -->
  <section class="tile tile--red" data-name="qr-a">
    <div class="qt qt--shadow qa" data-shape="wave" data-cut="#qa-cut">
      <a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-red.svg" alt="QR-код: vsekupony.ru">
        <span class="qr__logo"><img src="../assets/brand/logo-white.png" alt=""></span></a>
      <div class="qa__stub" id="qa-cut">
        <span class="qa__k">Все скидки города — здесь</span>
        <a class="qa__site" href="https://vsekupony.ru">vsekupony.ru</a>
      </div>
    </div>
  </section>

  <!-- B. Визитка -->
  <section class="tile tile--grey" data-name="qr-b">
    <div class="qt qt--soft qb" data-shape="round" data-cut="#qb-cut" data-dash="bold">
      <span class="qb__ava"><img src="../assets/brand/logo-white.png" alt="ВСЕКУПОНЫ"></span>
      <div class="qb__name">ВСЕКУПОНЫ</div>
      <div class="qb__sub">Купоны и&nbsp;скидки Липецкой области</div>
      <div class="qb__gap" id="qb-cut"></div>
      <a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-ink.svg" alt="QR-код: vsekupony.ru">
        <span class="qr__logo"><img src="../assets/brand/logo-white.png" alt=""></span></a>
      <div class="qb__site">Наведите камеру · <b>vsekupony.ru</b></div>
    </div>
  </section>

  <!-- D. Красный билет -->
  <section class="tile tile--light" data-name="qr-d">
    <div class="qt qt--shadow qa qd" data-shape="wave" data-cut="#qd-cut" data-dash="light">
      <a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-white.svg" alt="QR-код: vsekupony.ru">
        <span class="qr__logo qr__logo--white"><img src="../assets/brand/logo-red.png" alt=""></span></a>
      <div class="qa__stub" id="qd-cut">
        <span class="qa__k">Наведите камеру</span>
        <a class="qa__site" href="https://vsekupony.ru">vsekupony.ru</a>
      </div>
    </div>
  </section>

  <!-- E. «Просканируй меня», белый купон -->
  <section class="tile tile--red" data-name="qr-e">
    <div class="qt qt--shadow qe" data-shape="round" data-cut="#qe-cut" data-dash="dots">
      <div class="qe__frame"><a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-dots-ink.svg" alt="QR-код: vsekupony.ru"></a></div>
      <div class="qe__gap" id="qe-cut"></div>
      <div class="qe__plq">Просканируй меня</div>
    </div>
  </section>

  <!-- F. «Просканируй меня», красный купон -->
  <section class="tile tile--light" data-name="qr-f">
    <div class="qt qt--shadow qe qf" data-shape="round" data-cut="#qf-cut" data-dash="dots-light">
      <div class="qe__frame"><a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-dots-ink.svg" alt="QR-код: vsekupony.ru"></a></div>
      <div class="qe__gap" id="qf-cut"></div>
      <div class="qe__plq">Просканируй меня</div>
    </div>
  </section>

  <!-- G. Горизонтальный -->
  <section class="tile tile--red" data-name="qr-g">
    <div class="qt qt--shadow qe qg" data-shape="round" data-cut="#qg-cut" data-dash="dots" data-axis="x">
      <div class="qe__frame"><a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-dots-ink.svg" alt="QR-код: vsekupony.ru"></a></div>
      <div class="qe__gap" id="qg-cut"></div>
      <div class="qe__plq"><span>Просканируй меня</span></div>
    </div>
  </section>

  <!-- H. Плашка сверху -->
  <section class="tile tile--grey" data-name="qr-h">
    <div class="qt qt--soft qe qh" data-shape="wave" data-cut="#qh-cut" data-dash="dots">
      <div class="qe__plq">Просканируй меня</div>
      <div class="qe__gap" id="qh-cut"></div>
      <div class="qe__frame"><a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-dots-ink.svg" alt="QR-код: vsekupony.ru"></a></div>
    </div>
  </section>

  <!-- I. Тёмный купон -->
  <section class="tile tile--red" data-name="qr-i">
    <div class="qt qt--shadow qe qi" data-shape="round" data-cut="#qi-cut" data-dash="dots-light">
      <div class="qe__frame"><a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-dots-ink.svg" alt="QR-код: vsekupony.ru"></a></div>
      <div class="qe__gap" id="qi-cut"></div>
      <div class="qe__plq">Просканируй меня</div>
    </div>
  </section>

  <!-- J. Гладкая плашка с сайтом -->
  <section class="tile tile--light" data-name="qr-j">
    <div class="qt qt--shadow qe" data-shape="round" data-cut="#qj-cut" data-dash="dots">
      <div class="qe__frame"><a class="qr" href="https://vsekupony.ru"><img src="qr/qr-site-dots-ink.svg" alt="QR-код: vsekupony.ru"></a></div>
      <div class="qe__gap" id="qj-cut"></div>
      <div class="qe__plq qe__plq--round">Просканируй меня<small>vsekupony.ru</small></div>
    </div>
  </section>

</main>
<script>
(function () {
  /* Волнистый край: дуги радиуса R по шагу P — выпуклые «гребешки» с острыми
     впадинами, как у отрывного билета. Слева направо по верху, справа
     налево по низу. */
  function wave(x0, x1, y, dir, P, R) {
    var n = Math.max(1, Math.round(Math.abs(x1 - x0) / P)), s = (x1 - x0) / n, d = "";
    for (var i = 1; i <= n; i++) d += "A" + R + "," + R + " 0 0 " + (dir > 0 ? 1 : 1) + " " + (x0 + s * i).toFixed(2) + "," + y;
    return d;
  }
  /* Контур билета: w×h, вырезы радиуса N по бокам на высоте cy.
     shape = wave — волнистые верх и низ, round — скруглённые углы r. */
  function ticket(w, h, cy, N, shape) {
    var r = 36, P = 32, R = 21, a = 7, d;
    if (shape === "wave") {
      d = "M0," + a + wave(0, w, a, 1, P, R) +
          "V" + (cy - N) + "A" + N + "," + N + " 0 0 0 " + w + "," + (cy + N) +
          "V" + (h - a) + wave(w, 0, h - a, -1, P, R) +
          "V" + (cy + N) + "A" + N + "," + N + " 0 0 0 0," + (cy - N) + "Z";
    } else {
      d = "M" + r + ",0H" + (w - r) + "A" + r + "," + r + " 0 0 1 " + w + "," + r +
          "V" + (cy - N) + "A" + N + "," + N + " 0 0 0 " + w + "," + (cy + N) +
          "V" + (h - r) + "A" + r + "," + r + " 0 0 1 " + (w - r) + "," + h +
          "H" + r + "A" + r + "," + r + " 0 0 1 0," + (h - r) +
          "V" + (cy + N) + "A" + N + "," + N + " 0 0 0 0," + (cy - N) +
          "V" + r + "A" + r + "," + r + " 0 0 1 " + r + ",0Z";
    }
    return d;
  }
  function build() {
    document.querySelectorAll(".qt").forEach(function (q) {
      var old = q.querySelector(".qt__bg"); if (old) old.remove();
      var w = q.offsetWidth, h = q.offsetHeight, N = 30;
      var cut = q.querySelector(q.dataset.cut);
      /* линия отрыва — верх корешка; у визитки — середина промежутка */
      var dd = q.dataset.dash || "";
      /* axis = x — линия отрыва вертикальная: контур строим как у
         вертикального билета (w и h местами), а потом отражаем по диагонали */
      var X = q.dataset.axis === "x";
      if (X) { var t = w; w = h; h = t; }
      var cy = X ? cut.offsetLeft + cut.offsetWidth / 2
             : dd === "bold" || dd.indexOf("dots") === 0 ? cut.offsetTop + cut.offsetHeight / 2 : cut.offsetTop;
      var stroke = q.dataset.dash === "light" ? "rgba(255,255,255,.55)" : "#D3D3D3";
      var dash = dd.indexOf("dots") === 0
        ? 'stroke="' + (dd === "dots-light" ? "rgba(255,255,255,.6)" : "#D3D3D3") + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 20"'
        : q.dataset.dash === "bold"
        ? 'stroke="#E3E3E3" stroke-width="8" stroke-linecap="round" stroke-dasharray="34 26"'
        : 'stroke="' + stroke + '" stroke-width="4" stroke-dasharray="14 11"';
      q.insertAdjacentHTML("afterbegin",
        '<svg class="qt__bg" viewBox="0 0 ' + (X ? h + ' ' + w : w + ' ' + h) + '" width="' + (X ? h : w) + '" height="' + (X ? w : h) + '" aria-hidden="true">' +
        '<g' + (X ? ' transform="matrix(0,1,1,0,0,0)"' : '') + '><path d="' + ticket(w, h, cy, N, q.dataset.shape) + '"/>' +
        '<path fill="none" style="fill:none" ' + dash + ' d="M' + (N + 22) + ',' + cy + 'H' + (w - N - 22) + '"/></g></svg>');
    });
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(build);
  window.addEventListener("load", build);
})();
</script>
</body>
</html>
