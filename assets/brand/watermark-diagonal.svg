<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-label="Все купоны watermark pattern">
  <defs>
    <mask id="ball-cutout">
      <rect width="56" height="56" fill="#fff"/>
      <path d="M17 28c0-7 5-12 12-12s12 5 12 12-5 12-12 12c-3 0-5-.7-7-2l-7 3 2-8c0-1-1-3 0-5Z" fill="#000"/>
      <circle cx="29" cy="28" r="5" fill="#fff"/>
    </mask>
    <g id="lockup" fill="#fff">
      <circle cx="28" cy="28" r="24" mask="url(#ball-cutout)"/>
      <circle cx="29" cy="28" r="5"/>
      <text x="66" y="39" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="-.7">Все купоны</text>
    </g>
    <pattern id="tiles" width="430" height="250" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <use href="#lockup" x="32" y="70"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#tiles)"/>
</svg>
