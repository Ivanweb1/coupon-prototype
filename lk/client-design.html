     тот же продукт, а не отдельный интерфейс -->

<body class="lk lkd" data-role="client">

<!-- ===================================================================
     ДИЗАЙН КАБИНЕТА. Копия кабинета клиента для перехода от Ч/Б
     прототипа к дизайну. Идём по одному экрану: сейчас готовы каркас
     (меню, шапка) и дашборд. Остальные разделы пока в стилях прототипа
     и наследуют только базу — палитру, шрифт и кнопки.
     =================================================================== -->
<div class="lk__shell">

  <aside class="lk__side" id="lkSide">
    <a class="lk__logo" href="../index-design-3.html" title="Вернуться на публичную часть">
      <img class="lkd-logo__mark" src="../assets/brand/logo-red.png" alt="" width="26" height="44">
      <span class="lkd-logo__word">Все<br>купоны</span>
    </a>
    <span class="lkd-side__tag">Кабинет компании</span>

    <nav class="lk__nav" id="lkNav"></nav>

  </aside>

  <div class="lk__main">
    <header class="lk__top">
      <button class="lk__burger" id="lkBurger" aria-label="Меню кабинета">
        <span data-icon="burger"></span>
      </button>
      <span class="lk__spacer"></span>
      <a class="lk__wallet" href="?view=billing" id="lkWallet" hidden></a>
      <a class="btn btn--solid lk__cta" href="?view=new-regional" id="lkCta">
        <span data-icon="plus"></span><span>Создать купон</span>
      </a>
      <a class="lk__bell" href="?view=notifications" id="lkBell" aria-label="Уведомления">
        <span data-icon="bell"></span>
        <i class="lk__dot" id="lkDot"></i>
      </a>
      <div class="lk__me" id="lkMe"></div>
    </header>

    <main class="lk__view" id="lkView"></main>
  </div>

</div>

<div class="lk__scrim" id="lkScrim"></div>

<script src="assets/lk-data.js?v=20260917a"></script>
<script src="assets/lk.js?v=20260925a"></script>
<script src="assets/lk-design.js?v=20260925a"></script>
</body>
